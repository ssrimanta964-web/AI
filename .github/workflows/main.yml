name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Reorganize Files into Android Structure
        run: |
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/assets

          # Move Kotlin source files based on package declaration
          PACKAGE_DIR=$(grep -m 1 "^package " MainActivity.kt | awk '{print $2}' | tr -d ';' | tr '.' '/')
          if [ -n "$PACKAGE_DIR" ]; then
            mkdir -p "app/src/main/java/$PACKAGE_DIR"
            mv *.kt "app/src/main/java/$PACKAGE_DIR/" 2>/dev/null || true
          else
            mv *.kt app/src/main/java/ 2>/dev/null || true
          fi

          # Move manifests and XML resources
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
          [ -f activity_main.xml ] && mv activity_main.xml app/src/main/res/layout/
          [ -f strings.xml ] && mv strings.xml app/src/main/res/values/
          [ -f themes.xml ] && mv themes.xml app/src/main/res/values/
          [ -f ic_launcher.xml ] && mv ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/

          # Move acoustic model, FST, and config files into assets
          mv *.fst *.conf *.mdl *.dubm *.ie *.mat *.int *.stats app/src/main/assets/ 2>/dev/null || true

          # Set up Gradle build configuration
          [ -f build.gradle.kts ] && mv build.gradle.kts app/

          # Create a root build script
          cat << 'EOF' > build.gradle.kts
          // Root level build configuration
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Peter-AI-APK
          path: app/build/outputs/apk/debug/*.apk
